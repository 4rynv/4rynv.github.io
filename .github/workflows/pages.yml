# Publishes the site on every push to main. Before publishing, every image in photos/ is converted to resized WebP
# and listed in photos.json (tools/build_photos.py), so adding or deleting a photo only needs a push.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build site folder
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude tools --exclude _site ./ _site/
          python tools/build_photos.py --convert _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
